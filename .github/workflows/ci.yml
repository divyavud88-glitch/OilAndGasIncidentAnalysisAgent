name: FastAPI CI/CD

on:
  push:
    branches:
      - master

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check FastAPI app imports
        env:
          GROQ_API_KEY: dummy
          TAVILY_API_KEY: dummy
          VECTORSTORE_PATH: vectorstore/faiss_index
        run: python -c "import app; print('FastAPI app imported successfully')"

      - name: Deploy to EC2
        if: success()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ec2-user/OilAndGasIncidentAnalysisAgent
            git reset --hard
            git pull origin master
            source venv/bin/activate
            pip install -r requirements.txt
            sudo systemctl restart oil-gas-agent
            sudo systemctl status oil-gas-agent --no-pager